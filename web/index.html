<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Desks</title>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <aside id="panel" hidden></aside>
      <div id="status-bar"></div>
      <div id="tooltip" hidden></div>
      <div id="award-toast" hidden></div>
      <div id="lightbox" hidden><img alt="" /></div>
      <div id="modal" hidden></div>
      <div id="help" hidden>
        <div class="dialog">
          <h2>⌨️ 단축키</h2>
          <table>
            <tr><td><kbd>j</kbd> / <kbd>k</kbd></td><td>다음 / 이전 에이전트</td></tr>
            <tr><td><kbd>/</kbd></td><td>메시지 입력창으로</td></tr>
            <tr><td><kbd>Ctrl/⌘</kbd>+<kbd>K</kbd></td><td>대화 검색</td></tr>
            <tr><td><kbd>n</kbd></td><td>새 작업 만들기</td></tr>
            <tr><td><kbd>Ctrl/⌘</kbd>+휠, <kbd>-</kbd> <kbd>=</kbd></td><td>사무실 축소 / 확대</td></tr>
            <tr><td><kbd>0</kbd></td><td>원래 크기</td></tr>
            <tr><td><kbd>Esc</kbd></td><td>패널·창 닫기</td></tr>
            <tr><td><kbd>?</kbd></td><td>이 도움말</td></tr>
          </table>
          <p class="muted">아무 데나 누르면 닫힙니다</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
