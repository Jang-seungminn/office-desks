[package]
name = "od-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Office Desks HTTP/WS server on od-core (port of bridge/src/server.ts)"

[dependencies]
od-core = { path = "../od-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
http-body-util = "0.1"
rust-embed = "=8.12.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
url = "2"

[dev-dependencies]
async-trait = "0.1.92"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
dunce = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libtest-mimic = "0.8"
regex = "1"
sha2 = "0.11"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.29"

[target."cfg(unix)".dev-dependencies]
libc = "0.2"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading"] }

[[test]]
name = "native"
path = "tests/native/main.rs"
harness = false
