[package]
name = "od-app"
version = "0.1.0"
edition.workspace = true
rust-version = "1.90"
license.workspace = true
description = "Gongbang: the Office Desks desktop app (Tauri 2, core in-process)"
default-run = "gongbang"

[lib]
name = "od_app"
path = "src/lib.rs"

[[bin]]
name = "gongbang"
path = "src/main.rs"

[[example]]
name = "e2e_harness"
path = "examples/e2e_harness.rs"

[[test]]
name = "app"
path = "tests/app/main.rs"
harness = false

[dependencies]
od-core = { path = "../od-core" }
od-server = { path = "../od-server" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
rust-embed = "=8.12.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
url = "2"

[build-dependencies]
# windows/app.manifest copies tauri-build's own manifest: re-diff it when bumping tauri-build.
tauri-build = { version = "~2.7", features = [] }
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
dunce = "1"
serde_json = { workspace = true }
libtest-mimic = "0.8"
ureq = { version = "2", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[target."cfg(unix)".dev-dependencies]
libc = "0.2"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading"] }
