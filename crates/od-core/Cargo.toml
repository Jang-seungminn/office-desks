[package]
name = "od-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust port of the office-desks native core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
unicode-normalization = "0.1"
sha1_smol = "1"
dunce = "1"
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
