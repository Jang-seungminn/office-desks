name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The Rust goldens must match what the TS code writes today. macOS only: the TS golden script
      # writes values with the runner's temp dir in them, and those differ on Windows.
      # `add -N` makes a new, uncommitted golden show up too.
      - name: od-core goldens are fresh
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm run golden
          git add -N crates/od-core/tests/golden
          git diff --exit-code crates/od-core/tests/golden
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The contract replay (fixtures recorded on macOS) must really run on Windows. If the harness
      # silently had no trials, this list would lack `contract` (or the demo replay `contract_demo`)
      # and the step would fail. Same for od-orca's Windows-only `.cmd` shim trials.
      - name: Windows contract and .cmd shim trials are present
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test -p od-server --test native -- --list | grep -x 'contract: test'
          cargo test -p od-server --test native -- --list | grep -x 'contract_demo: test'
          cargo test -p od-orca --test cli -- --list | grep -x 'cmd_shim_round_trip: test'
          # Also proves the Common-Controls manifest (od-app's build.rs) is linked into test targets:
          # without it this binary dies at load, before it can list anything.
          cargo test -p od-app --test app -- --list | grep -x 'shutdown_disposes_agents: test'
  # The Gongbang app UI against the in-process server (Playwright, Rust harness, fake agent).
  # Then the unsigned bundles: a macOS .app and a Windows NSIS installer, as CI artifacts only.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build -w web
      - run: cargo build -p od-app --example e2e_harness
      # Playwright's default browser folder per OS; the lockfile pins the Playwright version.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright browsers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then npx -w app playwright install chromium webkit; else npx -w app playwright install chromium; fi
      # Builds app/dist-e2e (--mode e2e) first; app/dist is never touched.
      - run: npm run e2e -w app
      # The production UI (app/dist), and no E2E hook in it, before bundling.
      - run: npm run build -w app
      - name: app/dist has no E2E hook
        shell: bash
        run: "! grep -r __gongbangE2E app/dist"
      - name: Both UIs are built before bundling
        shell: bash
        run: test -f web/dist/index.html && test -f app/dist/index.html
      # `npx tauri` is the hoisted @tauri-apps/cli. No beforeBuildCommand (it would go through a shell).
      - name: tauri build (macOS .app)
        if: runner.os == 'macOS'
        working-directory: crates/od-app
        run: npx tauri build --bundles app
      - name: tauri build (Windows NSIS)
        if: runner.os == 'Windows'
        working-directory: crates/od-app
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: gongbang-${{ runner.os }}
          path: |
            target/release/bundle/macos/Gongbang.app
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ runner.os }}
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
