name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The Rust goldens must match what the TS code writes today. macOS only: on Windows the
      # checkout has CRLF line endings. `add -N` makes a new, uncommitted golden show up too.
      - name: od-core goldens are fresh
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm run golden
          git add -N crates/od-core/tests/golden
          git diff --exit-code crates/od-core/tests/golden
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
